# vnc3.yml

project_name: vnc3
on_project_stop: pkill x11vnc; pkill websockify;
windows:
  - control:
      panes:
        - |
          clear
          echo "pkill x11vnc;"
          echo "pkill websockify;"
  - window_1:
      layout: "3084,363x92,0,0{181x92,0,0,4,181x92,182,0,5}"
      panes:
        - /usr/bin/x11vnc -display :0 -clip xinerama0 -shared -forever -rfbport 5900 -xkb -repeat -bg  -nocursorshape -cursor most
        - /usr/bin/websockify --web=/usr/share/novnc 8002 localhost:5900
  - window_2:
      layout: "3084,363x92,0,0{181x92,0,0,4,181x92,182,0,5}"
      panes:
        - /usr/bin/x11vnc -display :0 -clip xinerama1 -shared -forever -rfbport 5901 -xkb -repeat -bg  -nocursorshape -cursor most
        - /usr/bin/websockify --web=/usr/share/novnc 8003 localhost:5901
  - window_3:
      layout: "3084,363x92,0,0{181x92,0,0,4,181x92,182,0,5}"
      panes:
        - /usr/bin/x11vnc -display :0 -clip xinerama2 -shared -forever -rfbport 5902 -xkb -repeat -bg  -nocursorshape -cursor most
        - /usr/bin/websockify --web=/usr/share/novnc 8004 localhost:5902
