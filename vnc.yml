# vnc.yml

project_name: vnc
on_project_stop: pkill x11vnc; pkill websockify;
windows:
  - control:
      panes:
        - |
          clear
          echo "pkill x11vnc;"
          echo "pkill websockify;"
  - window_1:
      layout: "3084,363x92,0,0{181x92,0,0,4,181x92,182,0,5}"
      panes:
        - /usr/bin/x11vnc -display :0 -viewonly -clip xinerama0 -shared -forever -rfbport 5900 -xkb -repeat -bg  -nocursorshape -cursor most
        - /usr/bin/websockify --web=/usr/share/novnc 8002 localhost:5900
